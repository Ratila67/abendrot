name: Étiquetage IA, test
# Lancement manuel : un appel par modèle Gemini (GEMINI_MODELS dans truth/vision.py) sur une image de test.
# Le résultat de chaque modèle s'affiche en annotation en haut du run, sans rien écrire dans le dépôt.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-truth.txt
      - run: pip install -r requirements-truth.txt
      - run: python -m truth.vision
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY_API }}
