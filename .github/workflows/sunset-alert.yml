name: Alerte sunset
# Lancée chaque jour à 11 h UTC (12 h en hiver, 13 h en été) par le Worker Cloudflare worker/cron.js :
# le planificateur de GitHub prend jusqu'à 6 h de retard, et un second déclenchement enverrait l'alerte deux fois.
on:
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sunset-alert.mjs
        env:
          TZ: Europe/Paris
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUNSETHUE_KEY: ${{ secrets.SUNSETHUE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '70' }}
          HIKES: ${{ vars.HIKES }}
