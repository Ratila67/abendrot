name: Alerte sunset
on:
  schedule:
    - cron: '0 11 * * *'   # 12 h (hiver) / 13 h (été), heure de Paris
  workflow_dispatch:
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sunset-alert.mjs
        env:
          TZ: Europe/Paris
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUNSETHUE_KEY: ${{ secrets.SUNSETHUE_KEY }}
          APP_URL: ${{ vars.APP_URL }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '70' }}
          HIKES: ${{ vars.HIKES }}
