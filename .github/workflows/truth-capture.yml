name: Vérité terrain, captures
on:
  schedule:
    - cron: '*/10 14-20 * * *'   # fenêtre UTC qui couvre tous les couchers de l'année en Alsace
  workflow_dispatch:
concurrency:
  group: truth-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-truth.txt
      - run: pip install -r requirements-truth.txt
      - run: python -m truth.capture
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
      - name: Enregistrer les données
        run: |
          git config user.name "abendrot-bot"
          git config user.email "abendrot-bot@users.noreply.github.com"
          git add data/truth
          git diff --cached --quiet || { git commit -m "vérité terrain : captures $(date -u +'%F %H:%M')" && git pull --rebase && git push; }
