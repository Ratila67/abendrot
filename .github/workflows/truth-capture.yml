name: Vérité terrain, captures
# Le planificateur de GitHub saute ou retarde les déclenchements fréquents (le 7/11 : 2 exécutions sur ~40,
# toutes après le coucher). Un seul déclenchement couvre donc toute la soirée : il attend le début de la fenêtre,
# capture toutes les 10 min et commite après chaque passage. Les autres créneaux sont des secours :
# s'ils arrivent trop tôt, après la soirée, ou pendant qu'une boucle tourne (file d'attente), ils repartent en 20 s.
# Depuis le 8/11 (6 h de retard, aucune capture), le Worker Cloudflare worker/cron.js lance ce workflow
# toutes les heures de 13 h à 19 h UTC ; les créneaux ci-dessous restent en secours.
on:
  schedule:
    - cron: '5,25,45 13-19 * * *'   # UTC : couvre les couchers de toute l'année en Alsace (15 h 35 à 19 h 40)
  workflow_dispatch:
concurrency:
  group: truth-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-truth.txt
      - run: pip install -r requirements-truth.txt
      - name: Capturer jusqu'à la fin de la soirée
        env:
          WINDY_KEY: ${{ secrets.WINDY_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
        run: |
          git config user.name "abendrot-bot"
          git config user.email "abendrot-bot@users.noreply.github.com"
          save() {
            git add data/truth
            git diff --cached --quiet && return 0
            git commit -q -m "vérité terrain : captures $(date -u +'%F %H:%M')"
            for i in 1 2 3; do git pull -q --rebase && git push -q && return 0; sleep 10; done
            echo "::warning::push impossible, nouvel essai au prochain passage"
          }
          while wait=$(python -m truth.capture --wait); do
            echo "Prochain passage dans ${wait} s"
            sleep "$wait"
            python -m truth.capture || echo "::warning::passage en échec, on continue"
            save
          done
          echo "Soirée terminée ou pas encore commencée."
