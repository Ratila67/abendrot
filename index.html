<!doctype html>
<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abendrot</title>
<meta name="description" content="Où voir le coucher de soleil ce soir en Alsace et dans les Vosges : horaires au spot, météo, traces GPX, carte IGN hors-ligne.">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E171C" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">

</head>
<body>

  <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.5 3.5 7v10l8.5 4.5 8.5-4.5V7zM3.5 7 12 11.5 20.5 7M12 11.5v10"/></symbol>

  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

<main id="app"></main>

<nav class="tabs" aria-label="Navigation">
  <a href="#liste" data-tab="liste"><svg class="ic" aria-hidden="true"><use href="#i-sunset"/></svg>Ce soir</a>
  <a href="#semaine" data-tab="semaine"><svg class="ic" aria-hidden="true"><use href="#i-cal"/></svg>Semaine</a>
  <a href="#carte" data-tab="carte"><svg class="ic" aria-hidden="true"><use href="#i-mtn"/></svg>Carte</a>
  <a href="#favoris" data-tab="favoris"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg>Favoris</a>
</nav>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><h2 id="setTitle">Réglages</h2><button class="icbtn" value="close" aria-label="Fermer"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <label class="field"><span>Rythme de marche</span>
      <select name="pace"><option value="1">Sans neige</option><option value="1.25">Neige tassée</option><option value="1.5">Raquettes, neige fraîche</option></select></label>
    <label class="field"><span>Partir de</span>
      <select name="home"><option value="gps">Ma position</option><option value="sxb">Strasbourg</option></select></label>
    <h3>Sources avec clé gratuite</h3>
    <label class="field"><span>Clé Sunsethue <small>qualité du coucher, 3 jours</small></span><input name="sunsethue" autocomplete="off" spellcheck="false" placeholder="Colle ta clé"></label>
    <label class="field"><span>Clé Windy Webcams <small>photos en direct des sommets</small></span><input name="windy" autocomplete="off" spellcheck="false" placeholder="Colle ta clé"></label>
    <label class="field"><span>URL du proxy <small>optionnel, garde les clés côté serveur</small></span><input name="proxy" type="url" inputmode="url" autocomplete="off" placeholder="https://abendrot-proxy.toi.workers.dev"></label>
    <p class="cap">Les clés restent sur ce téléphone. Elles ne sont jamais publiées avec l’app.</p>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" id="clearCache">Vider la carte hors-ligne</button>
      <button class="btn primary" value="save">Enregistrer</button>
    </div>
    <p class="cap">Données : IGN, OpenStreetMap, OpenTopoMap, Open-Meteo (Météo-France, CAMS), Sunsethue, Windy.</p>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./js/app.js"></script>
</body>
</html>
